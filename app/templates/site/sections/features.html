{% from "_macros.html" import head %}
{% set d = section.data %}
<section id="{{ section.id }}" class="section features features--{{ d.layout }}{% if section.alt %} section--alt{% endif %}" aria-labelledby="{{ section.id }}-title">
  <div class="container">
    {{ head(section, d.title, d.intro) }}
    <ul class="cards">
{% for item in d["items"] %}
      <li class="card">
        <span class="icon"><i class="fa-solid fa-{{ item.icon }}" aria-hidden="true"></i></span>
        <div>
          <h3>{{ item.title }}</h3>
          <p>{{ item.description }}</p>
        </div>
      </li>
{% endfor %}
    </ul>
  </div>
</section>
