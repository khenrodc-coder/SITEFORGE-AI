{% extends "base.html" %}
{% block title %}{{ title }} | SiteForge AI{% endblock %}

{% block body %}
<main id="main" class="flex min-h-screen items-center justify-center px-4">
  <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm">
    <p class="font-display text-5xl font-bold text-brand-600">{{ status }}</p>
    <h1 class="mt-3 font-display text-xl font-semibold">{{ title }}</h1>
    <p class="mt-2 text-slate-600">{{ message }}</p>
    <a href="{{ url_for('main.index') }}"
       class="mt-6 inline-flex min-h-[44px] cursor-pointer items-center gap-2 rounded-xl bg-brand-600 px-5 text-sm font-medium text-white transition-colors duration-200 hover:bg-brand-700">
      <i class="fa-solid fa-house" aria-hidden="true"></i> Back to home
    </a>
  </div>
</main>
{% endblock %}
