<section id="preview-section" class="mt-8 hidden" aria-labelledby="preview-title">
  <div id="preview-card" class="preview-card">

    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 bg-white px-4 py-3">
      <h2 id="preview-title" tabindex="-1" class="font-display text-lg font-semibold">Live preview</h2>

      <div class="flex flex-wrap items-center gap-2">
        <div role="group" aria-label="Preview size" class="inline-flex gap-1 rounded-xl border border-slate-300 p-1">
          <button type="button" class="seg-btn" data-device="desktop" aria-pressed="true">
            <i class="fa-solid fa-desktop" aria-hidden="true"></i><span>Desktop</span>
          </button>
          <button type="button" class="seg-btn" data-device="tablet" aria-pressed="false">
            <i class="fa-solid fa-tablet-screen-button" aria-hidden="true"></i><span>Tablet</span>
          </button>
          <button type="button" class="seg-btn" data-device="mobile" aria-pressed="false">
            <i class="fa-solid fa-mobile-screen" aria-hidden="true"></i><span>Mobile</span>
          </button>
        </div>
        <button id="preview-refresh" type="button" class="tool-btn">
          <i class="fa-solid fa-rotate" aria-hidden="true"></i><span>Refresh</span>
        </button>
        <button id="preview-fullscreen" type="button" class="tool-btn" aria-pressed="false">
          <i class="fa-solid fa-expand" aria-hidden="true"></i><span>Full screen</span>
        </button>
      </div>
    </div>

    <div id="preview-stage" class="preview-stage">
      <div id="preview-viewport" class="preview-viewport" data-device="desktop">
        <iframe id="preview-frame" class="preview-frame" title="Website preview"
                sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>

        <div id="preview-busy" class="preview-overlay" role="status">
          <i class="fa-solid fa-circle-notch fa-spin text-2xl text-brand-600" aria-hidden="true"></i>
          <p class="font-medium">Building the preview...</p>
        </div>

        <div id="preview-error" class="preview-overlay is-hidden" role="alert">
          <i class="fa-solid fa-triangle-exclamation text-2xl text-red-700" aria-hidden="true"></i>
          <p id="preview-error-message" class="font-medium text-red-900"></p>
          <button id="preview-retry" type="button" class="tool-btn">
            <i class="fa-solid fa-rotate" aria-hidden="true"></i><span>Try again</span>
          </button>
        </div>
      </div>
    </div>

    <div class="flex flex-wrap items-center justify-between gap-2 border-t border-slate-200 bg-white px-4 py-2 text-sm text-slate-700">
      <p id="preview-info" role="status">Desktop, 1280 px wide</p>
      <p>The preview is isolated from SiteForge. Email and phone links are switched off here.</p>
    </div>
  </div>
</section>
